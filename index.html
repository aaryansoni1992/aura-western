<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <title>Aura Western — Trendy Western Fashion | Rajasthan, India</title>
    <meta name="description" content="Discover trendy western fashion, modern dresses, co-ord sets, shirts, trousers, t-shirts, and winter wear for modern women across Rajasthan. Order seamlessly via WhatsApp." />
    <meta name="keywords" content="Aura Western, western wear Rajasthan, women fashion Jaipur, dresses, co-ords, trendy tops, shirts, trousers, jackets, Jaipur western wear, Jodhpur fashion" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Aura Western — Your Style. Your Statement." />
    <meta property="og:description" content="Trendy western fashion delivered across Rajasthan. Easy browsing, transparent pricing, and WhatsApp order confirmation." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fallback handler if index.html is opened directly as a file:// without server -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            root.innerHTML = [
              '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF8F5; font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, sans-serif; padding: 24px; box-sizing: border-box;">',
              '  <div style="max-width: 540px; width: 100%; background: #ffffff; border-radius: 24px; padding: 36px 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #E2E8F0; text-align: center;">',
              '    <div style="width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #E11D48, #8B5CF6, #F97316); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 0 auto 18px auto; box-shadow: 0 4px 15px rgba(225,29,72,0.25);">AW</div>',
              '    <h1 style="font-size: 22px; color: #0F172A; margin: 0 0 8px 0; font-weight: 700;">Aura Western — Preview Mode</h1>',
              '    <p style="font-size: 13px; color: #64748B; margin: 0 0 22px 0; line-height: 1.6;">',
              '      This file was opened directly via the <code>file://</code> protocol. Modern React & TypeScript applications need to be served via HTTP for full functionality.',
              '    </p>',
              '    <div style="background: #F8FAFC; border-radius: 16px; padding: 18px 20px; text-align: left; margin-bottom: 24px; font-size: 13px; color: #334155; border: 1px solid #E2E8F0; line-height: 1.8;">',
              '      <p style="font-weight: 700; margin: 0 0 8px 0; color: #0F172A;">How to view your store:</p>',
              '      <div style="margin-bottom: 10px;">',
              '        <strong>1. Live Local Server (Recommended):</strong><br/>',
              '        Open <a href="http://localhost:5173" style="color: #E11D48; font-weight: 700; text-decoration: underline;" target="_blank">http://localhost:5173</a> in Chrome/Edge.',
              '      </div>',
              '      <div style="margin-bottom: 10px;">',
              '        <strong>2. Double-Click Launcher:</strong><br/>',
              '        Double-click <code>Start-Aura-Western.bat</code> in this project folder.',
              '      </div>',
              '      <div>',
              '        <strong>3. Compiled Standalone Build:</strong><br/>',
              '        Open <a href="./dist/index.html" style="color: #8B5CF6; font-weight: 700; text-decoration: underline;">dist/index.html</a> in your browser.',
              '      </div>',
              '    </div>',
              '    <a href="http://localhost:5173" target="_blank" style="display: block; width: 100%; box-sizing: border-box; padding: 14px 20px; background: linear-gradient(135deg, #E11D48, #F43F5E); color: white; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 15px rgba(225,29,72,0.3);">',
              '      Open Live Store (http://localhost:5173) &rarr;',
              '    </a>',
              '  </div>',
              '</div>'
            ].join('\n');
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-slate-900 font-sans antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
